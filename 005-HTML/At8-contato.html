<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Contato - Loja Fictícia</title>
</head>
<body>

    <header>
        <h1>Contato</h1>
        <nav>
            <a href="At8-home.html">Home</a> | 
            <a href="At8-contato.html">Contato</a>
        </nav>
        <hr>
    </header>

    <h2>Fale Conosco</h2>
    <form action="#" method="post">
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="assunto">Assunto:</label><br>
        <select id="assunto" name="assunto">
            <option value="informacoes">Mais Informações</option>
            <option value="compra">Compra de Produto</option>
            <option value="suporte">Suporte Técnico</option>
        </select><br><br>

        <label for="mensagem">Mensagem:</label><br>
        <textarea id="mensagem" name="mensagem" rows="5" cols="40"></textarea><br><br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>

    <p><a href="At8-home.html">← Voltar para a Home</a></p>

    <footer>
        <hr>
        <p>&copy; 2025 Loja Fictícia</p>
    </footer>

</body>
</html>
